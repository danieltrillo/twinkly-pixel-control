<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twinkly Bridge</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1e21; --muted:#6b7280; --line:#e5e7eb;
          --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --idle:#6b7280; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1a1d23; --text:#e8eaed; --muted:#9aa0a6; --line:#2a2e36;
            --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --idle:#9aa0a6; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:baseline; padding:16px; }
  h1 { font-size:18px; margin:0; }
  .muted { color:var(--muted); }
  main { padding:0 16px 32px; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; overflow-x:auto; }
  .card h2 { font-size:14px; margin:0 0 10px; }
  table { border-collapse:collapse; width:100%; min-width:760px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; white-space:nowrap; }
  th { font-weight:600; color:var(--muted); font-size:12px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; background:var(--idle); }
  .ok .dot { background:var(--ok); } .warn .dot { background:var(--warn); } .bad .dot { background:var(--bad); }
  .small { font-size:12px; }
  .err { color:var(--bad); white-space:normal; }
  .w { color:var(--warn); white-space:normal; }
  .stats { display:flex; flex-wrap:wrap; gap:18px; }
  .stats div b { display:block; font-size:18px; }
  button { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  pre { margin:0; font-size:12px; max-height:260px; overflow:auto; white-space:pre-wrap; }
  .banner { background:var(--bad); color:#fff; padding:8px 12px; border-radius:8px; }
</style>
</head>
<body>
<header>
  <h1>Twinkly Bridge</h1>
  <span class="muted" id="meta"></span>
  <span style="flex:1"></span>
  <a href="setup" style="color:inherit">Setup</a>
  <a href="map" style="color:inherit">Pixel mapping</a>
  <button id="reload" title="Re-read the config file">Reload config</button>
</header>
<main>
  <div id="banner"></div>
  <section class="card">
    <h2>Input</h2>
    <div class="stats" id="input"></div>
  </section>
  <section class="card">
    <h2>Devices</h2>
    <table>
      <thead><tr>
        <th>Device</th><th>State</th><th>Universes</th><th>Pixels</th><th>In</th><th>Out</th><th>Controller</th>
      </tr></thead>
      <tbody id="devices"></tbody>
    </table>
  </section>
  <section class="card" id="unmapped-card" hidden>
    <h2>Arriving but not mapped to a device</h2>
    <div id="unmapped" class="small"></div>
  </section>
  <section class="card">
    <h2>Log</h2>
    <pre id="log"></pre>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function cls(state) {
  if (state === "streaming") return "ok";
  if (state === "offline" || state === "error") return "bad";
  if (state.startsWith("no input") || state === "connecting") return "warn";
  return "";
}
async function refresh() {
  try {
    const s = await (await fetch("api/status")).json();
    $("meta").textContent = `v${s.version} on ${s.hostname || "?"} · up ${s.uptime || 0}s · ${s.config_path}`;
    $("banner").innerHTML = s.config_error ? `<div class="banner">Config problem: ${esc(s.config_error)}</div>` : "";
    const i = s.input;
    $("input").innerHTML = i ? `
      <div><b>${esc(i.ip)}</b><span class="muted small">listening as</span></div>
      <div><b>${i.artnet_rx.fps}</b><span class="muted small">Art-Net pkts/s</span></div>
      <div><b>${i.sacn_rx.fps}</b><span class="muted small">sACN pkts/s</span></div>
      <div><b>${i.live_universes}</b><span class="muted small">live universes</span></div>
      <div><b>${i.polls_rx}</b><span class="muted small">ArtPolls answered</span></div>
      <div><b>${s.send_errors}</b><span class="muted small">send errors</span></div>` : `<span class="muted">not running</span>`;
    $("devices").innerHTML = s.devices.map((d) => {
      const info = d.info;
      const ctrl = info ? `${esc(info.product_code || "Twinkly")} · fw ${esc(info.firmware)}<br><span class="muted small">${info.number_of_led} ${esc(info.led_profile)} · v${d.udp_protocol} · ${esc(d.order)}</span>` : `<span class="muted">-</span>`;
      const notes = (d.error ? `<div class="err small">${esc(d.error)}</div>` : "") + d.warnings.map((w) => `<div class="w small">${esc(w)}</div>`).join("");
      return `<tr class="${cls(d.state)}">
        <td><b>${esc(d.name)}</b><br><span class="muted small">${esc(d.ip)}</span></td>
        <td><span class="dot"></span>${esc(d.state)}${notes}</td>
        <td>${esc(d.protocol)} ${esc(d.universes)}<br><span class="muted small">${d.universe_count} univ · ${esc(d.input)}</span></td>
        <td>${d.pixels}</td>
        <td>${d.rx.fps}/s</td>
        <td>${d.tx.fps} fps<br><span class="muted small">target ${d.fps}</span></td>
        <td>${ctrl}</td></tr>`;
    }).join("") || `<tr><td colspan="7" class="muted">No devices configured.</td></tr>`;
    const um = s.unmapped || [];
    $("unmapped-card").hidden = um.length === 0;
    $("unmapped").innerHTML = um.map((u) => `${esc(u.protocol)} ${esc(u.universe)} from ${esc(u.source)}`).join("<br>");
  } catch (e) {
    $("banner").innerHTML = `<div class="banner">Lost contact with the bridge</div>`;
  }
}
async function refreshLog() {
  try {
    const l = await (await fetch("api/log")).json();
    $("log").textContent = l.lines.slice(-120).map((r) => `${r.time} ${r.level.padEnd(7)} ${r.message}`).join("\n");
  } catch (e) {}
}
$("reload").onclick = async () => {
  const r = await (await fetch("api/reload", { method: "POST" })).json();
  if (!r.ok) alert(r.error);
  refresh();
};
refresh(); refreshLog();
setInterval(refresh, 1000);
setInterval(refreshLog, 3000);
</script>
</body>
</html>
