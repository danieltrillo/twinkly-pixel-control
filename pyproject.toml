[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "twinkly-bridge"
version = "0.1.0"
description = "Art-Net / sACN to Twinkly realtime pixel bridge: drive Twinkly Pro controllers pixel by pixel"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["PyYAML>=5.3", "aiohttp>=3.8"]

[project.scripts]
twinkly-bridge = "twinklybridge.cli:main"

[project.urls]
Homepage = "https://github.com/danieltrillo/twinkly-pixel-control"

[tool.setuptools.packages.find]
include = ["twinklybridge*"]

[tool.setuptools.package-data]
twinklybridge = ["example-config.yaml", "status.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
exclude = ["build", "dist"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
